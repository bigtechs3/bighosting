<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bighosting – Success</title>
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/matrix.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
</head>
<body>

    <!-- Matrix Background -->
    <canvas id="matrixCanvas"></canvas>

    <div class="container">
        <div class="card success">
            <div class="big-icon">⫸✅⫷</div>
            <h2>SERVER CREATED</h2>

            <!-- ─── Credentials Revealed Here ─── -->
            <div class="server-credentials">
                <p><strong>USERNAME:</strong> <span id="srvUser">-</span></p>
                <p><strong>PASSWORD:</strong> <span id="srvPass" style="color: #e74c3c; font-weight: bold;">-</span></p>
                <p><strong>EMAIL:</strong> <span id="srvEmail">-</span></p>
                <p><strong>PANEL:</strong> <span id="srvPanel">-</span></p>
                <p><strong>TOTAL SERVERS:</strong> <span id="srvTotal">-</span></p>
                <a id="srvLink" href="#" target="_blank" class="btn-panel">OPEN SERVER PANEL</a>
            </div>

            <p class="large-text">Thank you for choosing bighosting!</p>

            <div class="shapes">
                <span class="shape">@</span><span class="shape">#</span><span class="shape">$</span>
                <span class="shape">&</span><span class="shape">£</span><span class="shape">¢</span>
                <span class="shape">€</span><span class="shape">¥</span><span class="shape">π</span>
                <span class="shape">×</span><span class="shape">∆</span><span class="shape">✓</span>
                <span class="shape">°</span><span class="shape">^</span><span class="shape">~</span>
                <span class="shape">+</span><span class="shape">{</span><span class="shape">$</span>
                <span class="shape">$</span><span class="shape">:</span><span class="shape">#</span>
                <span class="shape">+</span><span class="shape">#</span><span class="shape">&</span>
                <span class="shape">$</span><span class="shape">#</span><span class="shape">(</span>
                <span class="shape">✓</span><span class="shape">¢</span><span class="shape">=</span>
                <span class="shape">%</span>
            </div>

            <div class="big-brand"><h1>bighosting</h1></div>
            <button class="btn-return" onclick="resetPurchase()">BUY ANOTHER SERVER</button>
        </div>
    </div>

    <audio id="clickSound" src="/assets/audio/click.mp3" preload="auto"></audio>
    <script src="/js/matrix.js"></script>
    <script>
        // ─── Load credentials from localStorage ───
        const username = localStorage.getItem('serverUsername') || 'N/A';
        const password = localStorage.getItem('serverPassword') || 'N/A';
        const email = localStorage.getItem('serverEmail') || 'N/A';
        const panel = localStorage.getItem('serverPanel') || 'N/A';
        const serverId = localStorage.getItem('serverId') || 'N/A';
        const totalServers = localStorage.getItem('totalServers') || '1';

        document.getElementById('srvUser').textContent = username;
        document.getElementById('srvPass').textContent = password;
        document.getElementById('srvEmail').textContent = email;
        document.getElementById('srvPanel').textContent = panel;
        document.getElementById('srvTotal').textContent = totalServers;
        document.getElementById('srvLink').href = panel;

        // ─── Confetti ───
        function launchConfetti() {
            const colors = ['#e74c3c', '#1a5276', '#2e86c1', '#888', '#c0392b', '#154360', '#FFD700', '#C0C0C0'];
            for (let i = 0; i < 120; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';
                piece.style.left = Math.random() * 100 + 'vw';
                piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                piece.style.width = Math.random() * 10 + 6 + 'px';
                piece.style.height = Math.random() * 8 + 4 + 'px';
                piece.style.animationDuration = Math.random() * 3 + 2 + 's';
                piece.style.animationDelay = Math.random() * 2 + 's';
                piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                piece.style.position = 'fixed';
                piece.style.top = '-10px';
                piece.style.zIndex = '9999';
                piece.style.pointerEvents = 'none';
                document.body.appendChild(piece);
                setTimeout(() => piece.remove(), 5000);
            }
        }
        launchConfetti();

        // ─── Reset ───
        function resetPurchase() {
            localStorage.clear();
            window.location.href = '/';
        }
        window.resetPurchase = resetPurchase;
    </script>
</body>
</html>
